<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <style>
    body { font-family: 'Sarabun', 'IBM Plex Sans Thai', Tahoma, sans-serif; padding: 16px; }
    table { border-collapse: collapse; width: 100%; max-width: 640px; }
    th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; }
    input[type=number] { width: 70px; }
    button { margin-top: 14px; padding: 8px 18px; }
  </style>
</head>
<body>
  <h3>ยืนยันรายการสั่งซื้อ: <?= pcCode ?></h3>
  <p>แก้จำนวนได้ตามจริง หรือใส่ 0 เพื่อปฏิเสธรายการนั้น</p>
  <table>
    <tr><th>รายการ</th><th>คงเหลือ</th><th>แนะนำ</th><th>ยืนยันจำนวน</th></tr>
    <? for (var i = 0; i < items.length; i++) { ?>
    <tr>
      <td><?= items[i].name ?></td>
      <td><?= items[i].balance ?></td>
      <td><?= items[i].suggested_qty ?></td>
      <td><input type="number" min="0" value="<?= items[i].suggested_qty ?>" data-sku="<?= items[i].sku ?>"></td>
    </tr>
    <? } ?>
  </table>
  <button onclick="submitForm()">ส่งคำยืนยัน</button>
  <p id="msg"></p>

  <script>
    function submitForm() {
      var inputs = document.querySelectorAll('input[data-sku]');
      var payload = [];
      inputs.forEach(function (inp) {
        payload.push({ sku: inp.dataset.sku, confirmedQty: Number(inp.value) || 0 });
      });
      document.getElementById('msg').textContent = 'กำลังส่ง...';
      google.script.run
        .withSuccessHandler(function () { document.getElementById('msg').textContent = 'บันทึกแล้ว ขอบคุณครับ/ค่ะ'; })
        .withFailureHandler(function (err) { document.getElementById('msg').textContent = 'เกิดข้อผิดพลาด: ' + err; })
        .submitConfirmation('<?= pcCode ?>', payload);
    }
  </script>
</body>
</html>
