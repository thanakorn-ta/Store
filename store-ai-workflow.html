<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",Tahoma,"Leelawadee UI",sans-serif;line-height:1.6}
header{max-width:1100px;padding:40px 28px 8px}
h1{font-size:clamp(1.6rem,3vw,2.3rem);margin:0 0 6px;font-weight:700;border-left:10px solid var(--ai);padding-left:14px;line-height:1.25}
header p{margin:0;color:var(--mut);max-width:70ch}
.legend{display:flex;flex-wrap:wrap;gap:18px;padding:14px 28px 6px;font-size:.9rem;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:8px}.sw{width:18px;height:12px;border-radius:3px;display:inline-block;border:1.5px solid var(--line)}
.wrap{overflow-x:auto;padding:10px 28px 30px}
svg{display:block;font-family:inherit}
.lane0{fill:var(--l0)}.lane1{fill:var(--l1)}.sep{stroke:var(--line);stroke-width:1;opacity:.35}
.ln{font-weight:700;font-size:15px;fill:var(--ink)}.ls{font-size:12px;fill:var(--mut)}
.step rect,.step path{stroke:var(--line);stroke-width:1.5}
.human rect{fill:var(--card)}.auto rect{fill:var(--steel);stroke:var(--steel)}.auto text{fill:#fff}
.ai rect{fill:var(--ai);stroke:#9C7A00}.ai text{fill:var(--aiink)}.decide path{fill:var(--card);stroke:var(--ink);stroke-width:2}
.t1{font-size:13.5px;font-weight:600;text-anchor:middle;fill:var(--ink)}.t2{font-size:11.5px;text-anchor:middle;fill:var(--mut)}
.auto .t2{fill:#D6E4EE}.ai .t2{fill:#5C4A00}
.num{fill:var(--ink)}.step .numt{fill:#fff;font-size:11px;font-weight:700;text-anchor:middle}
.db path,.db ellipse{fill:var(--db);stroke:var(--line);stroke-width:1.2}
.flow,.data,.dash,.no,.ok{fill:none;stroke-width:1.8}.flow{stroke:var(--line)}.data{stroke:var(--line);stroke-dasharray:2 4;opacity:.8}
.dash{stroke:var(--mut);stroke-dasharray:6 5}.no{stroke:var(--no)}.ok{stroke:var(--ok)}
.m{fill:var(--line)}.mr{fill:var(--no)}.mg{fill:var(--ok)}
.lbl{font-size:12px;fill:var(--mut);text-anchor:middle;font-weight:500}.no-l{fill:var(--no);font-weight:700}.ok-l{fill:var(--ok);font-weight:700}
.dash-bar{fill:none;stroke:var(--steel);stroke-width:1.5;stroke-dasharray:5 4}
